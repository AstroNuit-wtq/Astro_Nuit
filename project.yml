name: AstroNuit
options:
  bundleIdPrefix: com.astronuit
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarHidden: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Astro_Nuit needs your location to show the accurate night sky."
    INFOPLIST_KEY_NSMotionUsageDescription: "Astro_Nuit uses motion sensors for sky pointing mode."
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  AstroNuit:
    type: application
    platform: iOS
    sources:
      - path: AstroNuit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astronuit.app
        PRODUCT_NAME: Astro_Nuit
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
