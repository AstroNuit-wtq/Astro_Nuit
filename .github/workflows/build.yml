name: Build Astro_Nuit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show structure
        run: |
          echo "=== Repository contents ==="
          ls -la
          echo "=== Swift files ==="
          find . -name "*.swift" | head -40
          ls -la project.yml || echo "NO project.yml found"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project AstroNuit.xcodeproj \
            -scheme AstroNuit \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package
        if: always()
        run: |
          mkdir -p Payload final
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -1 || true)
          if [ -n "$APP" ]; then
            echo "Found app: $APP"
            cp -R "$APP" Payload/
            zip -r AstroNuit-unsigned.ipa Payload
            ls -lh AstroNuit-unsigned.ipa
          else
            echo "WARNING: No .app was produced by xcodebuild"
            zip -r AstroNuit-unsigned.ipa AstroNuit project.yml || true
          fi
          cp AstroNuit-unsigned.ipa final/ 2>/dev/null || true
          cp .github/workflows/build.yml final/workflow.yml
          cd final && zip -r ../AstroNuit-Build-Output.zip . && cd ..

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstroNuit-Build
          path: AstroNuit-Build-Output.zip
          retention-days: 5
