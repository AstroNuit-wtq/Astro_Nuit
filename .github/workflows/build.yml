name: Build Astro_Nuit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show structure
        run: |
          ls -la
          find . -name "*.swift" | head -30

      - name: Download NASA planet textures (public domain)
        run: |
          mkdir -p AstroNuit/Resources/Textures
          cd AstroNuit/Resources/Textures

          curl -L -o sun.jpg        "https://www.solarsystemscope.com/textures/download/2k_sun.jpg" || true
          curl -L -o mercury.jpg    "https://www.solarsystemscope.com/textures/download/2k_mercury.jpg" || true
          curl -L -o venus.jpg      "https://www.solarsystemscope.com/textures/download/2k_venus_surface.jpg" || true
          curl -L -o earth.jpg      "https://www.solarsystemscope.com/textures/download/2k_earth_daymap.jpg" || true
          curl -L -o moon.jpg       "https://www.solarsystemscope.com/textures/download/2k_moon.jpg" || true
          curl -L -o mars.jpg       "https://www.solarsystemscope.com/textures/download/2k_mars.jpg" || true
          curl -L -o jupiter.jpg    "https://www.solarsystemscope.com/textures/download/2k_jupiter.jpg" || true
          curl -L -o saturn.jpg     "https://www.solarsystemscope.com/textures/download/2k_saturn.jpg" || true
          curl -L -o uranus.jpg     "https://www.solarsystemscope.com/textures/download/2k_uranus.jpg" || true
          curl -L -o neptune.jpg    "https://www.solarsystemscope.com/textures/download/2k_neptune.jpg" || true

          echo "=== Downloaded textures ==="
          ls -lh
          du -sh .

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project AstroNuit.xcodeproj \
            -scheme AstroNuit \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        if: always()
        run: |
          mkdir -p Payload final
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -1 || true)
          if [ -n "$APP" ]; then
            echo "Found app: $APP"
            du -sh "$APP"
            cp -R "$APP" Payload/
            zip -r AstroNuit-unsigned.ipa Payload
            ls -lh AstroNuit-unsigned.ipa
          else
            echo "WARNING: No .app produced"
            zip -r AstroNuit-unsigned.ipa AstroNuit project.yml || true
          fi
          cp AstroNuit-unsigned.ipa final/ 2>/dev/null || true
          cp .github/workflows/build.yml final/workflow.yml
          cd final && zip -r ../AstroNuit-Build-Output.zip . && cd ..

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstroNuit-Build
          path: AstroNuit-Build-Output.zip
          retention-days: 5
